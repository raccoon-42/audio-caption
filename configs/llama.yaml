seed: 42
prefix_len: 8
batch_size: 4
dropout: 0.3
use_layernorm: true
weight_decay: 0.1
test_size: 0.1
model_name: meta-llama/Llama-3.2-1B
data_dir: data/dataset
checkpoint_dir: checkpoints
results_dir: results
stage1:
  epochs: 40
  lr: 0.004198339890077323
stage2:
  epochs: 30
  projection_lr: 0.013697950087299583
  lm_lr: 8.562768352859772e-07
lr_search:
  s1_lr: [1.0e-5, 2.0e-1]
  s2_proj_lr: [1.0e-5, 5.0e-2]
  # s2_lm_lr upper bound 7e-6: lm_lr >=~1e-5 triggers 1-epoch overfit collapse on the
  # 1B model; healthy optima sit at 1.2e-6/5.6e-6. Cap excludes the bad hot zone.
  s2_lm_lr: [1.0e-7, 7.0e-6]
